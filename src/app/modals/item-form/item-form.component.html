<ion-header>
  <ion-toolbar>
    <ion-title>{{ mode === 'add' ? 'Add Item' : 'Edit Item' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss('cancel')">Cancel</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="itemForm" (ngSubmit)="dismiss('submit')">
    <ion-list>
      <ion-item>
        <ion-label position="floating">Name *</ion-label>
        <ion-input formControlName="name" type="text" required></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Description</ion-label>
        <ion-textarea formControlName="description" rows="3"></ion-textarea>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Category *</ion-label>
        <ion-select formControlName="category_id" required>
          <ion-select-option *ngFor="let category of categories" [value]="category.id">
            {{ category.name }}
          </ion-select-option>
        </ion-select>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Barcode</ion-label>
        <ion-input formControlName="barcode" type="text"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Quantity *</ion-label>
        <ion-input formControlName="quantity" type="number" min="0" required></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Price *</ion-label>
        <ion-input formControlName="price" type="number" min="0" step="0.01" required></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Currency *</ion-label>
        <ion-input formControlName="currency" type="text" maxlength="3" required></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Images</ion-label>
        <input type="file" (change)="onFileChange($event)" accept="image/*" multiple class="ion-padding-top">
      </ion-item>

      <ion-grid *ngIf="previewUrls.length > 0">
        <ion-row>
          <ion-col size="4" *ngFor="let url of previewUrls; let i = index">
            <ion-card>
              <img [src]="url" alt="Preview">
              <ion-button fill="clear" color="danger" (click)="removeImage(i)">
                <ion-icon name="trash-outline"></ion-icon>
              </ion-button>
            </ion-card>
          </ion-col>
        </ion-row>
      </ion-grid>
    </ion-list>

    <div class="ion-padding">
      <ion-button expand="block" type="submit" [disabled]="!itemForm.valid">
        {{ mode === 'add' ? 'Add Item' : 'Save Changes' }}
      </ion-button>
    </div>
  </form>
</ion-content>
