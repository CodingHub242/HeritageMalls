<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title>
      Item Details
    </ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="editItem()">
        <ion-icon name="create"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">{{ item?.name || 'Item Details' }}</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="item-details" *ngIf="item">
    <div class="image-container">
      <ion-img [src]="item.image_url || 'assets/placeholder.png'" *ngIf="!isUploading"></ion-img>
      <div class="skeleton-image" *ngIf="isUploading"></div>
      <ion-button (click)="uploadImage()">
        <ion-icon name="camera" slot="start"></ion-icon>
        Change Image
      </ion-button>
      <input type="file" #fileInput (change)="onFileSelected($event)" accept="image/*" style="display: none;">
    </div>

    <ion-card class="details-card">
      <ion-card-header>
        <ion-card-title>{{ item.name }}</ion-card-title>
        <ion-card-subtitle>{{ item.barcode }}</ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <ion-item lines="full">
          <ion-label>
            <h2>Description</h2>
            <p>{{ item.description }}</p>
          </ion-label>
        </ion-item>

        <ion-item lines="full">
          <ion-label>
            <h2>Category</h2>
            <p>{{ item.category?.name || 'Uncategorized' }}</p>
          </ion-label>
          <ion-badge slot="end" color="primary">{{ item.category?.name }}</ion-badge>
        </ion-item>

        <ion-item lines="full" class="quantity-item">
          <ion-label>
            <h2>Quantity</h2>
          </ion-label>
          <ion-input 
            type="number"
            [value]="item.quantity"
            (ionChange)="updateQuantity($event)"
            min="0"
            placeholder="Enter quantity"
          ></ion-input>
        </ion-item>

        <ion-item lines="none">
          <ion-label>
            <h2>Last Updated</h2>
            <p>{{ item.updated_at | date:'medium' }}</p>
          </ion-label>
        </ion-item>
      </ion-card-content>
    </ion-card>

    <!-- <ion-card class="info-card">
      <ion-card-header>
        <ion-card-title>
          <ion-icon name="information-circle-outline" color="primary"></ion-icon>
          Additional Information
        </ion-card-title>
      </ion-card-header>

      <ion-card-content>
        <ion-button expand="block" (click)="fetchOnlineInfo()" [disabled]="!item.barcode">
          <ion-icon name="globe-outline" slot="start"></ion-icon>
          Fetch Online Info
        </ion-button>

        <div class="info-grid" *ngIf="onlineInfo">
          <ion-item *ngFor="let info of onlineInfo | keyvalue" lines="none">
            <ion-label>
              <h2>{{ info.key }}</h2>
              <p>{{ info.value }}</p>
            </ion-label>
          </ion-item>
        </div>
      </ion-card-content>
    </ion-card> -->
  </div>

  <!-- Loading state -->
  <div class="item-details" *ngIf="!item">
    <div class="skeleton-image"></div>
    <ion-card>
      <ion-card-content>
        <ion-item *ngFor="let i of [1,2,3]" lines="full">
          <ion-label>
            <ion-skeleton-text animated style="width: 60%"></ion-skeleton-text>
            <ion-skeleton-text animated style="width: 80%"></ion-skeleton-text>
          </ion-label>
        </ion-item>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
